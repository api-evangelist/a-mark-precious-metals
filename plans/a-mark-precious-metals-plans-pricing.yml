  Account" plan tier; that entry was not sourced from anything A-Mark publishes and has
  been removed. The honest measurement is zero published plans.
notes: >-
  A-Mark's public sitemaps contain no /pricing, /plans, /developers or /api page.
  Commercial terms for the wholesale trading relationship — spreads, settlement, credit
  lines, lease and consignment rates — are negotiated bilaterally under a dealer agreement
  and never published. Retail bullion product prices ARE public on the storefront
  (www.amark.com/products/), but those are commodity prices per item, not API plans, and
  the storefront gates dealer pricing behind login (the theme ships a
  "login-to-prices-msg" element). plan_count is 0 by measurement, not by omission.
