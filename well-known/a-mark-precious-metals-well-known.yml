description: >-
  A-Mark serves exactly one real /.well-known document: an OAuth 2.0 / OpenID Connect
  discovery document on portal.amark.com, the A-Mark Trading Portal. It is genuine JSON
  (application/json, 575 bytes) naming issuer https://portal.amark.com/ and the token
  endpoint https://portal.amark.com/connect/token. Everything else 404s. Note the two
  distinct false-positive shapes recorded below: www.amark.com is a WordPress site that
  returns a 404 status with a full 114KB HTML "Page not found" body, and portal.amark.com
  is an Angular single-page app that returns HTTP 200 with a 3,602-byte HTML shell for
  every unmatched path — only the openid-configuration and jwks paths break out of the
  shell and return real JSON.
hit_count: 2
