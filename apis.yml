description: >-
  A-Mark Precious Metals is a full-service precious metals trading company that wholesales
  gold, silver, platinum, and palladium bullion and coins to dealers, financial institutions,
  and investors. They operate trading desks 17 hours daily across global locations (US, Asia,
  Vienna) and offer wholesale sales, direct-to-consumer, logistics and storage, minting, and
  collateralized loans services. The company is renaming to Gold.com, Inc. and transferring
  to the NYSE under the ticker GOLD, alongside its $33M acquisition of Monex Deposit
  Company; A-Mark now sits as one brand inside the Gold.com brand family. A-Mark runs no
  public developer program: trading access is through the credentialed A-Mark Trading
  Portal at portal.amark.com, whose OAuth 2.0 discovery document is the only
  machine-readable contract the company serves.
