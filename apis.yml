apis:
  - aid: a-mark-precious-metals:a-mark-wholesale-trading
    name: A-Mark Wholesale Trading
    tags:
      - Precious Metals
      - Trading
      - Wholesale
      - Gold
      - Silver
      - Platinum
      - Palladium
    humanURL: https://portal.amark.com/
    baseURL: https://trading.amark.com
    x-base-url-provenance: >-
      Established by probe on 2026-08-29, not from documentation — A-Mark publishes no API
      reference. trading.amark.com resolves under A-Mark's own domain and answers as an
      ASP.NET Web API: a request to /v1/* returns the JSON envelope
      {"Message":"No HTTP resource was found that matches the request URI
      'https://trading.amark.com:8444/v1/openapi.json'."} while an unrouted path returns
      an HTML error page, so a versioned /v1 Web API is routing there. The human trading
      surface is the A-Mark Trading Portal at portal.amark.com, whose OAuth token endpoint
      (https://portal.amark.com/connect/token) is the documented door. No operation on
      this base is callable anonymously and no path inventory is published.
    properties:
      - url: https://www.amark.com/services
        type: Documentation
      - url: https://portal.amark.com/.well-known/openid-configuration
        type: OpenIDConnect
      - url: authentication/a-mark-precious-metals-authentication.yml
        type: Authentication
      - url: scopes/a-mark-precious-metals-scopes.yml
        type: OAuthScopes
    description: >-
      A-Mark's wholesale precious metals trading platform enables dealers and financial
      institutions to buy and sell gold, silver, platinum, and palladium bullion products.
      Offers spot, forward, and deferred transactions with limit and stop orders,
      48-hour settlement, and payment in USD, EUR, or product.

