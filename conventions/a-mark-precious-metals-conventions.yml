dry_run_mode:
  supported: na
  note: >-
    No publicly reachable write surface, so there is nothing to rehearse against. `na`
    rather than a zero.
reversibility:
  grade: na
  applicable: false
  detail: >-
    A-Mark exposes no public write API. The trading write surface (placing, amending and
    cancelling metals orders) exists behind the A-Mark Trading Portal login at
    portal.amark.com and is unreachable without dealer credentials, so no reversal
    operation, operationId or reversal window can be read from any published source.
    Reversal terms in the wholesale business are contractual, not API-level: A-Mark's own
    /risk/ page states that under its customer agreements A-Mark itself holds the option
    to "buy in" a customer's short position to protect against a widening deficit — a
    unilateral A-Mark right, not a customer-callable undo. Because no write surface is
    publicly callable, reversibility, dry_run_mode and idempotency-as-a-runtime-contract
    are all `na` here and stay in the denominator rather than scoring zero.
    NO REVERSAL WINDOW IS RECORDED because A-Mark publishes none; inventing one for a
    physical-settlement metals trade could cost a reader real money.
  operations: []
  window: null
  evidence:
    - url: https://portal.amark.com/login
      http_status: 200
      note: portal login — the only door to the write surface
    - url: https://www.amark.com/risk/
      http_status: 200
      note: contractual "buy in" language; an A-Mark right, not an API reversal
