  header: 'Authorization: Bearer <token>'
  token_endpoint: https://portal.amark.com/connect/token
  detail: >-
    Confidential client + resource-owner credentials. See
    authentication/a-mark-precious-metals-authentication.yml.
  source: https://portal.amark.com/.well-known/openid-configuration
idempotency:
  supported: unknown
  header: null
  scope: null
  retention: null
  note: >-
    No idempotency header, key or retry contract is documented, and none can be observed
    without portal credentials. Recorded as unknown — NOT as absent, and no `Idempotency`
    pointer is wired, because asserting either way would be a guess.
pagination:
  style: undocumented
  note: The backing Web API is unreachable anonymously; no pagination contract observable.
